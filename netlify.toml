# netlify.toml - Netlify 部署配置
# 静态站点 + Serverless Functions

[build]
  # 纯静态站点，无需 build 命令
  command = ""
  publish = "."

# 将 /api/chat 重写到 /.netlify/functions/chat
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# 将 /api/chatbot 重写到 /.netlify/functions/chatbot
[[redirects]]
  from = "/api/chatbot"
  to = "/.netlify/functions/chatbot"
  status = 200
  force = true

# SPA 回退：所有未匹配的路由返回 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Path = ["!/api/*", "!/.netlify/*"]}
